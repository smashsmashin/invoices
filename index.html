<!-- Functions

  <script>

    window.onload = (event) => {
      auto_grow_textarea(document.getElementById('supplier_address'));
      auto_grow_textarea(document.getElementById('client_address'));
      auto_grow_textarea(document.getElementById('payment_details'));
    }

    function update_amounts() {
      var i=0;
      var subtotal = 0;
      while(document.getElementById('product_name_'+i)) {
        if(document.getElementById('product_amount_'+i).value)
          subtotal += parseFloat(document.getElementById('product_amount_'+i).value);
        i++;
      }
      document.getElementById('invoice_subtotal').value = subtotal.toFixed(2);
      if(document.getElementById('invoice_subtotal').value && document.getElementById('invoice_tax').value) {
        document.getElementById('invoice_total').value = (parseFloat(document.getElementById('invoice_subtotal').value) * (100 + parseFloat(document.getElementById('invoice_tax').value)) / 100).toFixed(2);
        update_total_amount_verbally();
      }
    }

    function calc_row_amount(i) {
      if(document.getElementById('product_name_'+i) && document.getElementById('product_price_'+i).value && document.getElementById('product_quantity_'+i).value)
        document.getElementById('product_amount_'+i).value = (parseFloat(document.getElementById('product_price_'+i).value) * parseFloat(document.getElementById('product_quantity_'+i).value)).toFixed(2);
      update_amounts();
    }

    function add_table_row(el) {
      if(is_last_row(el) && el.value.length) {
        var row_el = clone_row(el.closest('tr'));
      }
    }

    function clone_row(el) {
      var clone = el.cloneNode(true);
      el.after(clone);
      Array.from(clone.cells).forEach((cell, index) => {
        var component = cell.getElementsByTagName('input')[0];
        component.id = calc_next_id(component);
        component.value = "";
      });
      return clone;
    }

    function calc_next_id(el) {
      var id_arr = el.id.split('_')
      id_arr.push(parseInt(id_arr.pop())+1);
      return id_arr.join('_');
    }

    function is_last_row(el) {
      return document.getElementById(calc_next_id(el)) == undefined;
    }

    function update_total_amount_verbally() {
      document.getElementById('verbally').value = Verbally_bg.convert(document.getElementById('invoice_total').value);
    }

    function select_currency(option) {
      return option && data.current && data.current.currency && data.current.currency.toUpperCase() == option.toUpperCase() ? 'selected' : 'ignored';
    }

    function select_payment_method(option) {
      return option && data.current && data.current.payment_method && data.current.payment_method.toUpperCase() == option.toUpperCase() ? 'selected' : 'ignored';
    }

    function mark_selected_invoice (inv_id) {
      Array.from(document.querySelectorAll('.inv_link.selected')).forEach((el) => el.classList.remove('selected'));
      document.getElementById('inv_'+inv_id).classList.add('selected');
    }

    function show_invoice(value) {
      data.current = data.invoices.find( ({ number }) => number == value );
      parse_invoices(data);
      mark_selected_invoice(data.current.number);
    }

    function get_next_invoice_number() {
      if (!data.invoices || data.invoices.length === 0) {
        return 1; // start from 1 if no invoices exist
      }

      const maxNumber = Math.max(...data.invoices.map(invoice => invoice.number || 0));
      return maxNumber + 1;
    }

    function clone_invoice(form) {
      data.current = null;
      form.number.value = get_next_invoice_number();
      form.date.value = new Date().toLocaleDateString('bg-BG');
    }

    function save_invoice(form) {
      if(!data.current) {
        if(data.invoices.find( ({ number }) => number == form.number.value ))
          console.error("Invoice with this number already exists. Please select it from the list before modifying it!");
        var new_invoice = {number: form.number.value};
        data.invoices.push(new_invoice);
        sort_invoices_desc(data);
        data.current = new_invoice;
      }
      if(!data.current.supplier)
        data.current.supplier = {};
      data.current.supplier.name = form.supplier_name.value;
      data.current.supplier.address = form.supplier_address.value;
      data.current.supplier.tax_no = form.supplier_tax_no.value;
      data.current.supplier.id_no = form.supplier_id_no.value;
      data.current.supplier.responsible = form.supplier_responsible.value;
      if(!data.current.client)
        data.current.client = {};
      data.current.client.name = form.client_name.value;
      data.current.client.address = form.client_address.value;
      data.current.client.tax_no = form.client_tax_no.value;
      data.current.client.id_no = form.client_id_no.value;
      data.current.client.responsible = form.client_responsible.value;
      data.current.proforma = form.proforma.checked;
      data.current.number = form.number.value;  
      data.current.date = form.date.value;
      data.current.currency = String(form.currency.value);
      data.current.verbally = form.verbally.value;
      data.current.place = form.place.value;
      data.current.due_date = form.due_date.value;
      data.current.payment_method = String(form.payment_method.value);
      data.current.payment_details = form.payment_details.value;
      data.current.created_by = form.created_by.value;
      data.current.received_by = form.received_by.value;
      data.current.products = [];
      var i = 0;
      while(form['product_name_'+i]) {
        if(form['product_name_'+i].value && form['product_price_'+i].value && form['product_quantity_'+i].value && form['product_unit_'+i].value && form['product_amount_'+i].value) {
          var row = {};
          row.product_name = form['product_name_'+i].value;
          row.product_price = form['product_price_'+i].value;
          row.product_quantity = form['product_quantity_'+i].value;
          row.product_unit = form['product_unit_'+i].value;
          row.product_amount = form['product_amount_'+i].value;
          data.current.products.push(row);
        }
        i++;
      }
      data.current.project = form.project.value;
      data.current.invoice_subtotal = form.invoice_subtotal.value;
      data.current.invoice_tax = form.invoice_tax.value;
      data.current.invoice_total = form.invoice_total.value;

      console.log(form.currency.value);

      console.log(data.current);
      data.current = undefined;

      store_invocies(data);
      data = load_invoices();
      show_invoice(form.number.value);

      return false;
    }

    function auto_grow_textarea(textField)
    {
      textField.style.height = 'auto';
      textField.style.height = textField.scrollHeight + "px";
    }

    function load_company_defaults(data) {
      data.supplier = {};
      data.supplier.name = 'ИТ България ООД';
      data.supplier.address = 'ул. Софроний Врачански №5&#10;Ихтиман, 2050&#10;България';
      data.supplier.tax_no = 'BG130983696';
      data.supplier.id_no = '130983696';
      data.supplier.responsible = 'Ивайло Цанов';
      data.default_currency = 'BGN';
      data.default_payment_method = 'bank_transfer';
      data.default_payment_details = 'Централна Кооперативна Банка&#10;гр. София, ж.к. Красна поляна, бул. Възкресение, бл. 132А&#10;SWIFT: CECBBGSF&#10;IBAN: BG98CECB97901093971500';
    }

    
    // local storage
    // -----------------------

    const STORAGE_NAME = 'IT-Bulgaria Invoices1';

    function sort_invoices_desc(data) {
      data.invoices.sort(function(a, b) {
        return b.number - a.number;
      });
    }

    function load_invoices() {
      var data = JSON.parse(localStorage.getItem(STORAGE_NAME));

      // If no data loaded - create new
      if(!data)
        data={invoices:[]};

      sort_invoices_desc(data);

      load_company_defaults(data)

      return data;
    }

    function store_invocies(data) {
      localStorage.setItem(STORAGE_NAME, JSON.stringify(data));
    }

    function export_data(data) {
      window.open(URL.createObjectURL(
        new File([JSON.stringify(data, undefined, 2)], STORAGE_NAME + ".json", {
          type: 'data:text/json;charset=utf-8'}
        )
      ));
    }

    function import_data(targetEl, callback) {
      // disable default drag & drop functionality
      targetEl.addEventListener('dragenter', function(e){ e.preventDefault(); });
      targetEl.addEventListener('dragover',  function(e){ e.preventDefault(); });

      targetEl.addEventListener('drop', function(event) {

          var reader = new FileReader();
          reader.onloadend = function() {
              var data = JSON.parse(this.result);
              callback(data);
          };

          reader.readAsText(event.dataTransfer.files[0]);    
          event.preventDefault();
      });
    }
  </script>
