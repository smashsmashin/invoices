<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Basic Page Needs
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <meta charset="utf-8">
  <title>Your page title here :)</title>
  <meta name="description" content="">
  <meta name="author" content="">

  <!-- Mobile Specific Metas
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- FONT
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">

  <!-- CSS
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/custom.css">

  <!-- Javascript
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script src="js/doT.js" type="text/javascript"></script>
  <script src="js/verbally_en.js" type="text/javascript"></script>
  <script src="js/verbally_bg.js" type="text/javascript"></script>
  <script src="js/config.js" type="text/javascript"></script>
  <script src="js/calculations.js" type="text/javascript"></script>
  <script src="js/crypto.js" type="text/javascript"></script>
  <script src="js/drive.js" type="text/javascript"></script>
  <script src="js/storage.js" type="text/javascript"></script>
  <script src="js/invoice_form.js" type="text/javascript"></script>
  <script src="js/print.js" type="text/javascript"></script>

  <!-- Favicon
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <link rel="icon" type="image/png" href="images/favicon.png">


  <!-- End Document
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
</head>
<body>
  <div id="login" class="container">
  </div>
  <div id="dialog" class="hidden">
  </div>
  <div id="header_container" class="container">
    <div id="header" class="twelve columns">
    </div>
  </div>
<div id="invoices" class="container">
    <div id="inv_list_container" class="row">
      <div id="invoice_list" class="twelve columns">
      </div>
    </div>
  </div>
  <div id="container" class="container" style="margin-top: 20px;">
  </div>
</body>


<!-- Templates
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->

  <!-- Invoices list Layout
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script id="header_tmpl" type="text/x-dot-template">
    <a href="#invoice_list" class="non_print" onclick="return toggle_invoice_list();"><center>{{!it.current?.number || 'номер'}} / {{!it.current?.date || 'дата'}}</center></a>
    {{ var status = sync_status(); }}
    <div class="non_print sync_status{{=status.problem?' problem':''}}">
      <center>
        {{!status.text}}{{? status.action}} <a href="#" onclick="sync_status_action(); return false;">{{!status.action}}</a>{{?}}
        <span class="session_links">{{!session.email}} · <a href="#" onclick="return open_people_dialog();">Достъп</a> · <a href="#" onclick="return logout();">Изход</a></span>
      </center>
    </div>
  </script>

  <!-- Login screen: Google account, shared file, password
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script id="login_tmpl" type="text/x-dot-template">
    <div class="login_box">
      <h4>Фактури - ИТ България</h4>
      {{? it.error}}<p class="login_error">{{!it.error}}</p>{{?}}
      {{? it.busy}}
      <p>Моля, изчакайте…</p>
      {{?? it.step == 'loading'}}
      {{? !it.error}}<p>Зареждане…</p>{{?}}
      {{?? it.step == 'google'}}
      <p>Влезте с Google профила, с който е споделен файлът с фактурите.</p>
      <input class="button-primary" type="button" value="Вход с Google" onclick="login_with_google()">
      {{ var legacy_count = legacy_invoices().length; }}
      {{? legacy_count}}
      <p class="login_note">В този браузър има {{=legacy_count}} фактури от старата версия (без Google Drive).
        <a href="#" onclick="export_data({invoices: legacy_invoices()}); return false;">Изтеглете ги като файл</a>, за да ги внесете след входа с бутона Import.</p>
      {{?}}
      {{?? it.step == 'file'}}
      <p>Влезли сте като <b>{{!session.email}}</b>. Изберете споделения файл с фактурите (<i>{{!DRIVE_FILE_NAME}}</i>) от Google Drive. Това е нужно само веднъж.</p>
      <input class="button-primary" type="button" value="Избери файла" onclick="choose_store_file()">
      <p class="login_note">Първи път ли започвате? <a href="#" onclick="show_login_step('create'); return false;">Създайте нов файл с фактури</a>.
        Ако сте влезли с грешен профил, <a href="#" onclick="return logout();">излезте</a>.</p>
      {{?? it.step == 'password'}}
      <form onsubmit="submit_password(this); return false;">
        <label for="login_password">Парола за <b>{{!session.email}}</b></label>
        <input class="u-full-width" type="password" id="login_password" name="password" autocomplete="current-password" required>
        <input class="button-primary" type="submit" value="Вход">
      </form>
      <p class="login_note"><a href="#" onclick="show_login_step('file'); return false;">Друг файл</a> · <a href="#" onclick="return logout();">Изход</a></p>
      {{?? it.step == 'new_password'}}
      <form onsubmit="submit_new_password(this); return false;">
        <p>Влязохте с временна парола. Задайте своя парола (поне {{=MIN_PASSWORD_LENGTH}} знака). Ако я забравите, друг човек с достъп може да ви даде нова временна.</p>
        <label for="new_password">Нова парола</label>
        <input class="u-full-width" type="password" id="new_password" name="password" autocomplete="new-password" required>
        <label for="new_password_repeat">Повторете паролата</label>
        <input class="u-full-width" type="password" id="new_password_repeat" name="repeat" autocomplete="new-password" required>
        <input class="button-primary" type="submit" value="Запази и влез">
      </form>
      {{?? it.step == 'create'}}
      {{ var count = legacy_invoices().length; }}
      <form onsubmit="create_store_file(this); return false;">
        <p>Ще бъде създаден нов шифрован файл в Google Drive на <b>{{!session.email}}</b>{{? count}} с {{=count}} фактури от този компютър (след това те ще бъдат изтрити от браузъра){{?}}.
          Други хора се добавят после от бутона „Достъп“.</p>
        <p class="login_note">Ако паролите на всички бъдат забравени, данните не могат да бъдат възстановени. Пазете и архив (бутон Export).</p>
        <label for="create_password">Парола (поне {{=MIN_PASSWORD_LENGTH}} знака)</label>
        <input class="u-full-width" type="password" id="create_password" name="password" autocomplete="new-password" required>
        <label for="create_password_repeat">Повторете паролата</label>
        <input class="u-full-width" type="password" id="create_password_repeat" name="repeat" autocomplete="new-password" required>
        <input class="button-primary" type="submit" value="Създай">
        <input class="button" type="button" value="Назад" onclick="show_login_step('file')">
      </form>
      {{?}}
    </div>
  </script>

  <!-- Access dialog: who can open the file, and changing your own password
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script id="people_tmpl" type="text/x-dot-template">
    <div class="dialog_box">
      <a href="#" class="u-pull-right" onclick="return close_people_dialog();">Затвори</a>
      <h5>Достъп до фактурите</h5>
      <table class="u-full-width">
        {{~it.people :person}}
        <tr>
          <td>{{!person.email}}{{? person.email == it.me}} (вие){{?}}{{? person.temp}} <i>- с временна парола</i>{{?}}</td>
          <td>{{? person.email != it.me}}<a href="#" data-email="{{!person.email}}" onclick="remove_person(this.dataset.email); return false;">Премахни</a>{{?}}</td>
        </tr>
        {{~}}
      </table>
      <form onsubmit="add_person(this); return false;">
        <h6>Добавяне на човек</h6>
        <p class="login_note">Google профилът му ще получи достъп до файла; временната парола му я кажете по друг път.</p>
        <input class="u-full-width" type="email" name="email" placeholder="Имейл на Google профила" required>
        <input class="u-full-width" type="text" name="password" placeholder="Временна парола (поне {{=MIN_PASSWORD_LENGTH}} знака)" autocomplete="off" required>
        <input class="button" type="submit" value="Добави">
      </form>
      <form onsubmit="change_password(this); return false;">
        <h6>Смяна на моята парола</h6>
        <input class="u-full-width" type="password" name="password" placeholder="Нова парола" autocomplete="new-password" required>
        <input class="u-full-width" type="password" name="repeat" placeholder="Повторете паролата" autocomplete="new-password" required>
        <input class="button" type="submit" value="Смени">
      </form>
    </div>
  </script>

  <!-- Invoices list Layout
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script id="inv_list_tmpl" type="text/x-dot-template">
    <div class="list_close"><a href="#" onclick="return toggle_invoice_list();">✕ Затвори</a></div>
    {{~it.invoices :inv}}
    <div>
      <a id="inv_{{!inv.number}}" class="inv_link" data-number="{{!inv.number}}" onclick="return open_invoice(this.dataset.number);" href="#">{{!inv.number}} от {{!inv.date}}{{!inv.client?.name ? ' - ' + inv.client.name : ''}}</a>
    </div>
    {{~}}
  </script>

<!-- Primary Page Layout
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script id="inv_tmpl" type="text/x-dot-template">
    {{ var inv = it.current; }}
    {{ var supplier = COMPANY.supplier; }}
    <form onsubmit="return false">
      <div class="row">
        <div class="six columns">
          <label for="supplier_name">Изпълнител:</label>
          <input class="u-full-width" type="text" placeholder="Име" id="supplier_name" value="{{!inv?.supplier?.name || supplier.name}}">
        </div>
        <div class="six columns">
          <label for="client_name">Клиент:</label>
          <input class="u-full-width" type="text" placeholder="Име" id="client_name" value="{{!inv?.client?.name}}">
        </div>
      </div>
      <div class="row">
        <div class="six columns">
          <textarea class="u-full-width" placeholder="Адрес" id="supplier_address" style="resize: vertical; overflow-y: hidden; height: auto;" onchange="auto_grow_textarea(this)" oninput="auto_grow_textarea(this)">{{!inv?.supplier?.address || supplier.address}}</textarea>
        </div>
        <div class="six columns">
          <textarea class="u-full-width" placeholder="Адрес" id="client_address" style="resize: vertical; overflow-y: hidden; height: auto;" onchange="auto_grow_textarea(this)" oninput="auto_grow_textarea(this)">{{!inv?.client?.address}}</textarea>
        </div>
      </div>
      <div class="row">
        <div class="six columns">
          <label for="supplier_tax_no" id="supplier_tax_no_label" class="inline print_only">ДДС №:</label>
          <input class="u-full-width print-inline" type="text" placeholder="ДДС №" id="supplier_tax_no" value="{{!inv?.supplier?.tax_no || supplier.tax_no}}">
        </div>
        <div class="six columns">
          <label for="client_tax_no" id="client_tax_no_label" class="inline print_only">ДДС №:</label>
          <input class="u-full-width print-inline" type="text" placeholder="ДДС №" id="client_tax_no" value="{{!inv?.client?.tax_no}}">
        </div>
      </div>
      <div class="row">
        <div class="six columns">
          <label for="supplier_id_no" id="supplier_id_no_label" class="inline print_only">ИД №:</label>
          <input class="u-full-width print-inline" type="text" placeholder="ИД №" id="supplier_id_no" value="{{!inv?.supplier?.id_no || supplier.id_no}}">
        </div>
        <div class="six columns">
          <label for="client_id_no" id="client_id_no_label" class="inline print_only">ИД №:</label>
          <input class="u-full-width print-inline" type="text" placeholder="ИД №" id="client_id_no" value="{{!inv?.client?.id_no}}">
        </div>
      </div>
      <div class="row">
        <div class="six columns">
          <label for="supplier_responsible" id="supplier_responsible_label" class="inline print_only">М.О.Л.</label>
          <input class="u-full-width print-inline" type="text" placeholder="М.О.Л." id="supplier_responsible" value="{{!inv?.supplier?.responsible || supplier.responsible}}">
        </div>
        <div class="six columns">
          <label for="client_responsible" id="client_responsible_label" class="inline print_only">М.О.Л.</label>
          <input class="u-full-width print-inline" type="text" placeholder="М.О.Л." id="client_responsible" value="{{!inv?.client?.responsible}}">
        </div>
      </div>
      <div class="row">
        <div class="twelve columns">&nbsp;</div>
      </div>
      <div id="invoice_label_row" class="row non_print">
        <div class="twelve columns">
          <H3><center>ФАКТУРА</center></H3>
        </div>
      </div>
      <div id="invoice_number_row" class="row non_print">
        <div class="three columns">&nbsp;</div>
        <div class="three columns">
          <input class="u-full-width" type="text" placeholder="Номер" id="number" style="text-align: right;" value="{{!it.current?.number}}" onchange="refresh_header(this.form)">
        </div>
        <div class="three columns">
          <input class="u-full-width" type="text" placeholder="Дата" id="date" value="{{!it.current?.date}}" onchange="refresh_header(this.form)">
        </div>
        <div class="three columns">
          <input id="proforma" type="checkbox" {{=it.current?.proforma ? 'checked' : ''}}>
          <span class="label-body">Проформа</span>
        </div>
      </div>
      <div id="invoice_label_row_print" class="row print_only">
        <div class="twelve columns">
          <H4>{{=it.current?.proforma ? 'ПРОФОРМА ' : ''}}ФАКТУРА</H4> <H6><span id="number">№ {{!it.current ? String(it.current.number).padStart(10, '0') : ''}}</span> от <span id="number">{{!it.current ? without_year_suffix(it.current.date) : ''}} г.</span></H6>
        </div>
      </div>
      <div class="row">
        <div class="twelve columns">
          <table class="u-full-width">
            <thead>
              <tr>
                <th><div>Наименование&nbsp;на&nbsp;стоката&nbsp;или&nbsp;услугата</div></th>
                <th><div>Цена</div></th>
                <th><div>Количество</div></th>
                <th><div>Мярка</div></th>
                <th><div>Стойност</div></th>
              </tr>
            </thead>
            <tbody>
              {{ var last_index = 0; }}
              {{ var products = inv?.products; }}
              {{~products :pr :i}}
              <tr>
                <td>
                  <input class="u-full-width non_print" type="text" placeholder="Наименование на стоката или услугата" id="product_name_{{=i}}" onchange="add_table_row(this)" value="{{!pr.product_name}}">
                  <div class="u-full-width print_only">{{!pr.product_name}}</div>
                </td>
                <td><input class="u-full-width" type="text" placeholder="Цена" id="product_price_{{=i}}" value="{{!pr.product_price}}" onchange="calc_row_amount(row_index(this))"></td>
                <td><input class="u-full-width" type="text" placeholder="Количество" id="product_quantity_{{=i}}" value="{{!pr.product_quantity}}" onchange="calc_row_amount(row_index(this))"></td>
                <td><input class="u-full-width" type="text" placeholder="Мярка" id="product_unit_{{=i}}" value="{{!pr.product_unit}}"></td>
                <td><input class="u-full-width" type="text" placeholder="Стойност" id="product_amount_{{=i}}" value="{{!pr.product_amount}}" onchange="update_amounts()"></td>
              </tr>
              {{ last_index = i+1; }}
              {{~}}
              <tr>
                <td><input class="u-full-width" type="text" placeholder="Наименование на стоката или услугата" id="product_name_{{=last_index}}" onchange="add_table_row(this)"></td>
                <td><input class="u-full-width" type="text" placeholder="Цена" id="product_price_{{=last_index}}" onchange="calc_row_amount(row_index(this))"></td>
                <td><input class="u-full-width" type="text" placeholder="Количество" id="product_quantity_{{=last_index}}" onchange="calc_row_amount(row_index(this))"></td>
                <td><input class="u-full-width" type="text" placeholder="Мярка" id="product_unit_{{=last_index}}"></td>
                <td><input class="u-full-width" type="text" placeholder="Стойност" id="product_amount_{{=last_index}}" onchange="update_amounts()"></td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td colspan="12"><input class="u-full-width" type="text" placeholder="Проект" id="project" value="{{!inv?.project}}"></td>
              </tr>
              <tr>
                <td colspan="4" class="footer-label">Данъчна основа</td>
                <td><input class="u-full-width" type="text" id="invoice_subtotal" readonly tabindex="-1" value="{{!inv?.invoice_subtotal}}"></td>
              </tr>
              <tr>
                <td colspan="3" class="footer-label">ДДС</td>
                <td><div class="vat_rate"><input class="u-full-width" type="text" id="invoice_tax" onchange="update_amounts()" value="{{!inv?.invoice_tax || COMPANY.default_vat_rate}}"><span>%</span></div></td>
                <td><input class="u-full-width" type="text" id="invoice_tax_amount" readonly tabindex="-1" value="{{!inv ? inv.invoice_tax_amount || calc_vat_amount(inv.invoice_subtotal, inv.invoice_tax) : ''}}"></td>
              </tr>
              <tr>
                <td colspan="4" class="footer-label">Сума за плащане</td>
                <td><input class="u-full-width" type="text" id="invoice_total" readonly tabindex="-1" value="{{!inv?.invoice_total}}"></td>
              </tr>
              <tr id="vat_exempt_row" class="{{=is_zero_rate(inv?.invoice_tax || COMPANY.default_vat_rate) ? '' : 'hidden'}}">
                <td colspan="5">
                  <label class="inline" for="invoice_tax_exempt_basis">Основание за неначисляване на ДДС</label>
                  <input class="u-full-width" type="text" id="invoice_tax_exempt_basis" list="tax_exempt_bases" placeholder="напр. чл. 21, ал. 2 от ЗДДС" value="{{!inv?.invoice_tax_exempt_basis}}">
                  <datalist id="tax_exempt_bases">
                    {{~known_tax_exempt_bases(it) :basis}}
                    <option value="{{!basis}}">
                    {{~}}
                  </datalist>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
      <div class="row">
        <div class="three columns">
          <label class="inline" for="currency">Валута</label>
        </div>
        <div class="nine columns">
          <select id="currency" onchange="update_total_amount_verbally()">
            <option {{!select_currency('BGN')}} value="BGN">BGN</option>
            <option {{!select_currency('EUR')}} value="EUR">EUR</option>
            <option {{!select_currency('USD')}} value="USD">USD</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="three columns">
          <label class="inline" for="verbally">Словом</label>
        </div>
        <div class="nine columns">
          <input class="u-full-width inline" type="text" id="verbally" value="{{!inv?.verbally}}">
        </div>
      </div>

      <div class="row">
        <div class="three columns">
          <label class="inline" for="place">Място на сделката</label>
        </div>
        <div class="nine columns">
          <input class="u-full-width inline" type="text" id="place" value="{{!inv?.place}}">
        </div>
      </div>

      <div class="row">
        <div class="nine columns print-inline">
          <label class="inline" for="due_date">Дата на възникване на данъчното събитие(дата на плащане)</label>
        </div>
        <div class="three columns">
          <input class="u-full-width inline" type="text" id="due_date" value="{{!inv?.due_date}}">
        </div>
      </div>

      <div class="row">
        <div class="three columns">
          <label class="inline" for="payment_method">Начин на плащане</label>
        </div>
        <div class="nine columns">
          <select id="payment_method">
            <option {{!select_payment_method('bank_transfer')}} value="bank_transfer">Банков превод</option>
            <option {{!select_payment_method('credit_card')}} value="credit_card">Карта</option>
            <option {{!select_payment_method('cash')}} value="cash">Касово</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="three columns">
          &nbsp;  
        </div>
        <div class="nine columns">
          <textarea class="u-full-width" placeholder="Детайли за плащането" id="payment_details" style="resize: vertical; overflow-y: hidden; height: auto;" onchange="auto_grow_textarea(this)" oninput="auto_grow_textarea(this)">{{!inv?.payment_details || COMPANY.default_payment_details}}</textarea>
        </div>
      </div>

      <div class="row signature-separator">
        <div class="twelve columns">&nbsp;</div>
      </div>

      <div class="row">
        <div class="six columns">
          <label class="inline" for="created_by">Съставена от</label>
          <input class="u-full-width inline" type="text" id="created_by" value="{{!inv?.created_by || COMPANY.created_by}}">
        </div>
        <div class="six columns">
          <label class="inline" for="received_by">Получена от</label>
          <input class="u-full-width inline" type="text" id="received_by" value="{{!inv?.received_by}}">
        </div>
      </div>

      <div class="row">
        <div class="twelve columns">&nbsp;</div>
      </div>

      <div id="action_buttons" class="row non_print">
        <div class="six columns">
          <input class="button" type="button" value="Clone" onclick="clone_invoice(this.form)">
          <a href="#invoice_list" class="button">Invoices</a>
          <input class="button" type="button" value="Export" onclick="export_data(data)">
          <input class="button" type="button" value="Import" onclick="document.getElementById('import_file_input').click()">
          <input type="file" id="import_file_input" accept=".json,application/json" style="display: none;" onchange="import_file(this.files[0]); this.value = '';">
        </div>
        <div class="six columns">
          <input class="u-pull-right button-primary" type="button" value="Save" onclick="save_invoice(this.form)">
        </div>
      </div>
    </form>
  </script>
    
<!-- Start-up
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script src="js/login.js" type="text/javascript"></script>
  <script src="js/app.js" type="text/javascript"></script>

</html>
